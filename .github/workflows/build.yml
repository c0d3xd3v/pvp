name: build

# Every push / PR: tests + packaged app for Linux and Windows (downloadable
# from the workflow run). A tag v* additionally publishes a GitHub release.
on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04        # oldest glibc we support -> runs on newer distros
            artifact: pvp-linux-x86_64
          - os: windows-2022
            artifact: pvp-windows-x64
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      EXT_DIR: ${{ github.workspace }}/ext       # fTetWild module + its shared libs
      BUILD_DIR: ${{ github.workspace }}/external/floattetwild-wrapper/build

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # --- system dependencies -------------------------------------------
      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp-dev libegl1 libgl1 libopengl0 \
            libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3

      # Caches are restored/saved explicitly: actions/cache only saves at the end
      # of a *successful* job, so a later failing step would force a full rebuild.
      - name: Restore GMP (Windows)
        if: runner.os == 'Windows'
        id: gmp-cache
        uses: actions/cache/restore@v4
        with:
          path: C:/vcpkg/installed
          key: vcpkg-gmp-x64-windows-v1

      - name: GMP via vcpkg (Windows)
        if: runner.os == 'Windows' && steps.gmp-cache.outputs.cache-hit != 'true'
        run: C:/vcpkg/vcpkg install gmp:x64-windows

      - name: Save GMP (Windows)
        if: runner.os == 'Windows' && steps.gmp-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: C:/vcpkg/installed
          key: vcpkg-gmp-x64-windows-v1

      # --- fTetWild Python module ------------------------------------------
      - name: Restore fTetWild build
        id: ftw-cache
        uses: actions/cache/restore@v4
        with:
          path: external/floattetwild-wrapper/build
          key: ftw-${{ runner.os }}-${{ hashFiles('external/floattetwild-wrapper/CMakeLists.txt', 'external/floattetwild-wrapper/cmake/**', 'external/floattetwild-wrapper/src/**', 'external/fTetWild/CMakeLists.txt', 'external/fTetWild/cmake/**', 'external/fTetWild/src/**') }}

      - name: Build fTetWild module
        shell: bash
        run: |
          python -m pip install --upgrade pip
          extra=""
          if [ "$RUNNER_OS" = "Windows" ]; then extra="-DGMP_ROOT=C:/vcpkg/installed/x64-windows"; fi
          cmake -S external/floattetwild-wrapper -B "$BUILD_DIR" \
                -DCMAKE_BUILD_TYPE=Release -DPython_EXECUTABLE="$(which python)" $extra
          cmake --build "$BUILD_DIR" --config Release --parallel 4
          cmake --install "$BUILD_DIR" --config Release --prefix "$EXT_DIR" \
                --component pyfloattetwildwrapper
          ls -la "$EXT_DIR"

      - name: Save fTetWild build
        if: steps.ftw-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: external/floattetwild-wrapper/build
          key: ${{ steps.ftw-cache.outputs.cache-primary-key }}

      # --- tests -------------------------------------------------------------
      - name: Python dependencies
        run: python -m pip install -r requirements.txt pytest pyinstaller==6.22.3

      - name: Tests
        shell: bash
        run: PYTHONPATH="$EXT_DIR" python -m pytest tests -q -p no:warnings

      # --- package -----------------------------------------------------------
      - name: Package (PyInstaller)
        shell: bash
        run: |
          pyside6-rcc resources/resources.qrc -o resources/resources.py
          PVP_EXT_DIR="$EXT_DIR" python -m PyInstaller packaging/pvp.spec --noconfirm

      - name: Smoke test of the packaged app
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then dist/pvp/pvp.exe --smoke-test; else dist/pvp/pvp --smoke-test; fi

      - name: Archive
        shell: bash
        run: |
          cp LICENSE README.md resources/icons/pvp.png dist/pvp/
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then 7z a -tzip ../${{ matrix.artifact }}.zip pvp > /dev/null
          else tar czf ../${{ matrix.artifact }}.tar.gz pvp; fi
          cd .. && ls -la ${{ matrix.artifact }}.*

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.*
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
